# cargo-deny policy: run `cargo deny check` (CI does, in the `deny` job).
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the whole tree, demo feature included, for every platform we ship.
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Every RustSec advisory, unmaintained and unsound crates included, fails the
# check unless it is listed here with a reason.
version = 2
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
version = 2
# What the dependency tree actually uses; all are compatible with shipping an
# MIT binary. Add a license only after reading it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    # ksni, the Linux tray item under fastframe-tray: public domain.
    "Unlicense",
    "Zlib",
    # The fonts bundled by egui (Ubuntu, Hack, Noto) and fastframe-fonts.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

[bans]
# Duplicates are reported but don't fail: most come from egui/winit's own
# tree and only move when they do.
multiple-versions = "warn"
wildcards = "deny"
# Path and git dependencies inside this workspace aren't wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The shared fastframe crates and the egui and winit forks they build on
# (see [patch.crates-io] in Cargo.toml). Nothing else may come from git.
allow-git = [
    "https://github.com/crmne/fastframe",
    "https://github.com/crmne/egui",
    "https://github.com/crmne/winit",
]
