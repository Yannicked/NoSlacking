name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Every action is pinned by commit SHA (the tag is in the comment), so a moved
# tag can't change what runs here. The toolchain comes from
# rust-toolchain.toml through the runner's own rustup, so each job installs
# exactly one compiler: the pinned one.
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install
      - name: GUI build dependencies and packaging validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libssl-dev cmake desktop-file-utils appstream libclang-dev libpipewire-0.3-dev
      - name: Desktop entry
        run: desktop-file-validate packaging/applications/cloud.yannick.NoSlacking.desktop
      # The project has no public homepage yet; drop the override once
      # the metainfo has a <url type="homepage">.
      - name: AppStream metainfo
        run: appstreamcli validate --no-net --override=url-homepage-missing=info packaging/metainfo/cloud.yannick.NoSlacking.metainfo.xml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Formatting
        run: cargo fmt --all --check
      # --workspace: the app, and the video helper and its
      # protocol under crates/.
      - name: Clippy (default features)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install
      # libpipewire-0.3-dev and libclang-dev: the video helper's
      # `pipewire` feature (screen sharing under Wayland; the app itself
      # links no PipeWire) generates its bindings against PipeWire's
      # headers with bindgen, which loads libclang. Nothing else needs
      # them: the camera is the helper's, through V4L2 spoken directly.
      # libssl-dev: huddles' DTLS links the system's OpenSSL on Linux;
      # macOS and Windows build their own (Perl, and NASM if the runner
      # has it, else OpenSSL's C code alone).
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libssl-dev cmake libclang-dev libpipewire-0.3-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Linux is linted in `quality`; the macOS and Windows `cfg` code
      # (keyring stores, single instance, the URL scheme) only here.
      - name: Clippy (default features)
        if: runner.os != 'Linux'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (all features)
        if: runner.os != 'Linux'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # The helper's GPU test is ignored: the runners have no GPU.
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Build (what ships)
        run: cargo build --locked -p noslacking -p noslacking-video
      - name: Demo build
        run: cargo build --locked --features demo

  # Starts the real app against the pretend Slack and saves a few
  # screenshots, so a window that no longer opens or draws on one platform
  # shows up here. `--demo-shot` writes the PNG and closes the window by
  # itself. The PNGs are uploaded for a look.
  demo-shots:
    name: demo shots (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install
      # The runner has no display: Xvfb is one, Mesa's llvmpipe draws in it.
      - name: GUI build dependencies and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libssl-dev cmake xvfb xauth libgl1-mesa-dri libegl-mesa0 libxkbcommon-x11-0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Demo build
        run: cargo build --locked --features demo
      # The runner has no GPU and Windows' own OpenGL is 1.1, too old for
      # glow. Mesa's opengl32.dll beside the exe is loaded before the
      # system one (mesa-dist-win's per-app deployment) and draws with
      # llvmpipe. The archive is pinned by version and checksum.
      - name: Software OpenGL
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MESA_VERSION: 26.2.4
          MESA_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695
        run: |
          $archive = "$env:RUNNER_TEMP\mesa.7z"
          curl.exe -fsSL --retry 3 -o $archive "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash
          if ($hash -ne $env:MESA_SHA256) { throw "mesa archive checksum $hash does not match" }
          7z e $archive -otarget\debug -y x64\opengl32.dll x64\libgallium_wgl.dll
          if ($LASTEXITCODE -ne 0) { throw "7z failed" }
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Screenshots
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p shots
          exe=target/debug/noslacking
          run=()
          if [ "$RUNNER_OS" = Linux ]; then
            export LIBGL_ALWAYS_SOFTWARE=1
            run=(xvfb-run -a -s "-screen 0 1600x1000x24")
          fi
          shot() {
            local name=$1
            shift
            echo "::group::$name"
            # macOS ships bash 3.2, where an empty "${run[@]}" trips set -u.
            ${run[@]+"${run[@]}"} "$exe" --verbose --demo --demo-shot "shots/$name.png" "$@"
            echo "::endgroup::"
            if [ ! -s "shots/$name.png" ]; then
              echo "::error::shots/$name.png is missing or empty"
              exit 1
            fi
          }
          shot conversation
          shot thread --demo-view thread
          shot dm --demo-view dm
          shot settings --demo-view settings
          shot light --demo-light
          shot thread-light --demo-view thread --demo-light
          ls -l shots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: demo-shots-${{ matrix.os }}
          path: shots/*.png
          if-no-files-found: warn

  # Advisories, licenses, duplicate crates and where dependencies come from;
  # the policy is deny.toml.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features
