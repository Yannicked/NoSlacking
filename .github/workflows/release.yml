name: Release

# Pushing a tag like v0.2.0 builds every platform and publishes a GitHub
# release with the archives, .deb and .rpm packages and a Flatpak attached.
# The tag must match the version in Cargo.toml.
#
# Run by hand (Actions → Release → Run workflow) it is a dry run: the same
# builds for Cargo.toml's version, kept as the run's artifacts, and nothing
# published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit SHA, the release tag in the comment. Release
# builds start from a clean target directory: no rust-cache.
jobs:
  # The version every package is named for: Cargo.toml's, which a tag must
  # match.
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        id: version
        run: |
          crate=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$crate" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  linux:
    name: linux x86_64
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install
      - name: Build dependencies and packaging validators
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libssl-dev cmake desktop-file-utils appstream dpkg-dev
      # The app and its video helper (crates/noslacking-video), which
      # decodes all huddle video. Releases do not share screens yet
      # (`huddle-share` is off); when they do, only the helper needs
      # `--features noslacking-video/pipewire`, and this job (and the
      # Flatpak) libpipewire-0.3-dev and libclang-dev to build it.
      - name: Build
        run: cargo build --locked --release -p noslacking -p noslacking-video
      - name: Package
        run: |
          name="noslacking-$VERSION-linux-x86_64"
          root="dist/$name"
          mkdir -p "$root/bin" "$root/share/applications" "$root/share/metainfo" "$root/share/icons"
          cp target/release/noslacking target/release/noslacking-video "$root/bin/"
          cp packaging/applications/cloud.yannick.NoSlacking.desktop "$root/share/applications/"
          cp packaging/metainfo/cloud.yannick.NoSlacking.metainfo.xml "$root/share/metainfo/"
          cp -R packaging/icons/hicolor "$root/share/icons/"
          cp LICENSE README.md "$root/"
          desktop-file-validate "$root/share/applications/cloud.yannick.NoSlacking.desktop"
          appstreamcli validate --no-net --override=url-homepage-missing=info "$root/share/metainfo/cloud.yannick.NoSlacking.metainfo.xml"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      # The same files as the archive, as packages; what goes where is in
      # Cargo.toml's [package.metadata.deb] and [package.metadata.generate-rpm].
      - name: Packagers
        run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.0
      - name: Debian and RPM packages
        run: |
          cargo deb --locked --no-build
          cargo generate-rpm
          cp target/debian/*.deb target/generate-rpm/*.rpm dist/
          dpkg-deb --info dist/*.deb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # The Flatpak, as a single-file bundle for `flatpak install`. Flatpak
  # builds offline: the crate list comes from Cargo.lock, made here with
  # flatpak-builder-tools' generator at a fixed commit.
  flatpak:
    name: flatpak x86_64
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GENERATOR_REV: 74697c75b630d7330e77250fc13cb5ea688d9479
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Flatpak, the runtime and the Rust SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08
      - name: Crate sources
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet aiohttp==3.14.3 tomlkit==0.15.1
          curl -fsSL -o "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/$GENERATOR_REV/cargo/flatpak-cargo-generator.py"
          "$RUNNER_TEMP/venv/bin/python" "$RUNNER_TEMP/flatpak-cargo-generator.py" \
            Cargo.lock -o packaging/flatpak/cargo-sources.json
      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --state-dir=packaging/flatpak/.flatpak-builder \
            --repo=packaging/flatpak/repo \
            packaging/flatpak/build packaging/flatpak/cloud.yannick.NoSlacking.yml
      - name: Bundle
        run: |
          mkdir -p dist
          flatpak build-bundle packaging/flatpak/repo \
            "dist/noslacking-$VERSION-linux-x86_64.flatpak" cloud.yannick.NoSlacking \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  macos:
    name: macos universal
    needs: version
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build
        run: |
          cargo build --locked --release --target aarch64-apple-darwin -p noslacking -p noslacking-video
          cargo build --locked --release --target x86_64-apple-darwin -p noslacking -p noslacking-video
          mkdir -p dist
          for bin in noslacking noslacking-video; do
            lipo -create -output "dist/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
            lipo -info "dist/$bin"
          done
      - name: Package
        run: |
          name="noslacking-$VERSION-macos-universal"
          mkdir -p "dist/$name"
          packaging/macos/bundle.sh dist/noslacking "$VERSION" "dist/$name" dist/noslacking-video
          cp LICENSE README.md "dist/$name/"
          # ditto keeps the bundle's symlinks, permissions and signature.
          ditto -c -k --keepParent "dist/$name" "dist/$name.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  windows:
    name: windows x86_64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install
      - name: Build
        run: cargo build --locked --release -p noslacking -p noslacking-video
      - name: Package
        shell: pwsh
        run: |
          $name = "noslacking-$($env:VERSION)-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item target/release/noslacking.exe, target/release/noslacking-video.exe, LICENSE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: publish
    needs: [linux, flatpak, macos, windows]
    # Only a tag publishes; a run by hand stops at the artifacts.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Creating the release and uploading its assets.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
