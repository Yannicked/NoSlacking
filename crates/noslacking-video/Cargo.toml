[package]
name = "noslacking-video"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "NoSlacking's video helper: decodes H.264, and captures and encodes the screen and camera, on the GPU or in software, in a process of its own"
repository = "https://github.com/Yannicked/NoSlacking"

[lib]
name = "noslacking_video"
path = "src/lib.rs"

[[bin]]
name = "noslacking-video"
path = "src/main.rs"

[dependencies]
noslacking-video-ipc = { path = "../video-ipc" }
# The camera's background blur (src/blur.rs): tract runs the person
# segmentation model on the processor, pure Rust (MIT/Apache-2.0); its
# unsafe is its own SIMD kernels. A first try, on with NOSLACKING_BLUR=1.
tract-onnx = "0.23.8"
# H.264 decoded in software where the GPU cannot (or is not wanted): pure
# Rust (rusty_h264, BSD-2-Clause; the decoder itself forbids unsafe, its
# SIMD kernels in rusty_h264-accel, the `asm` feature, are intrinsics
# behind runtime CPU checks, no assembly or C). Its default features are
# off: they would install its own global allocator. Here rather than in
# the app since it reads strangers' streams; see src/software.rs.
rusty_h264-decoder = { version = "0.16", default-features = false, features = ["std", "asm"] }
# A shared screen encoded in software where the GPU cannot (or is not
# wanted): rusty_h264's encoder, the same project, pure Rust, its
# default features off for the same reason. rusty_h264-common holds the
# picture type it takes.
rusty_h264-encoder = { version = "0.16", default-features = false, features = ["std", "asm"] }
rusty_h264-common = { version = "0.16", default-features = false, features = ["std", "asm"] }
# A captured screen's packed RGB to I420 for the software encoder, and
# the test screen back to RGB (BSD-3-Clause/Apache-2.0, SIMD chosen at
# run time; its unsafe is the intrinsics). The GPU converts on its own.
yuv = "0.8.19"
# A webcam's MJPEG frames (Zlib/MIT/Apache-2.0, pure Rust, its SIMD
# behind run-time checks; already in the tree as `image`'s JPEG decoder).
# It fills in the Huffman tables MJPEG frames leave out.
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std", "x86", "neon"] }

# VA-API, Linux's video acceleration API. libva is opened at run time
# (libloading, ISC), never linked: the helper builds without libva's
# headers and starts on a system without it, where it reports no
# hardware. The H.264 parser is ChromeOS's (cros-codecs, BSD-3-Clause)
# without any of its back ends: its default features are none, and its
# parser and bitstream reader need only `log`. The decoding state around
# it (picture order, reference marking, reference lists) is ours, in
# src/h264.rs, as is the small part of libva's API used (src/vaapi/ffi.rs).
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8.9"
# fcntl, to make the pipe a picture goes back through larger (src/pipe.rs),
# and the camera's V4L2 calls (ioctl, mmap, poll: src/capture/camera/v4l2.rs).
libc = "0.2.189"
cros-codecs = { version = "0.0.6", default-features = false }
# Sharing the screen of an X11 session without the ScreenCast portal:
# x11rb's own connection (pure Rust, no libxcb), the screens from RandR.
x11rb = { version = "0.13.2", default-features = false, features = ["randr"] }
# Sharing the screen under Wayland and in the Flatpak (the `pipewire`
# feature): the ScreenCast portal over D-Bus (ashpd, MIT, pure Rust, on
# zbus with its async-io executor; futures-lite waits on it) and the
# frames through PipeWire. `pipewire` (MIT) is bindings to the system's
# libpipewire-0.3, generated by bindgen at build time (libclang, and
# libpipewire-0.3-dev's headers through pkg-config), and libspa-sys
# compiles five small C files of wrappers around SPA's inline functions;
# the helper then links libpipewire-0.3.so.0. Only the helper: the app
# never sees a frame.
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screencast"], optional = true }
pipewire = { version = "0.10.1", optional = true }
futures-lite = { version = "2.6", default-features = false, features = ["std"], optional = true }

# Sharing the screen on macOS and Windows: xcap (Apache-2.0), over
# objc2's CoreGraphics bindings and the windows crate; nothing compiled.
# The camera there: nokhwa (Apache-2.0; AVFoundation on macOS, where
# objc_exception compiles a one-file Objective-C shim with Xcode's clang,
# and Media Foundation on Windows through the windows crate). Without its
# default `decoding` feature, which would build mozjpeg's C; MJPEG is
# zune-jpeg's. Moved here from the app, so its native parts are the
# helper's alone. On Linux the helper speaks V4L2 itself, which needs no
# libclang (nokhwa's V4L2 bindings are made by bindgen).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
xcap = { version = "0.9.8", default-features = false }
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }

# Media Foundation, Windows' video API: H.264 decoded through its own
# decoder on the GPU (DXVA, over a Direct3D 11 device) and encoded by the
# GPU vendor's encoder (src/mediafoundation/). The `windows` crate
# (MIT/Apache-2.0) is bindings only, nothing compiled, at the version
# nokhwa's Media Foundation camera already brings.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS's Screen Recording permission, checked and asked for before the
# first capture (already in the tree through xcap).
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow"] }
# VideoToolbox, macOS's video acceleration API, for decoding and
# encoding H.264 on the GPU (src/videotoolbox/): objc2's bindings to the
# system frameworks (MIT/Apache-2.0/Zlib, nothing compiled), the
# CoreMedia and CoreVideo types VideoToolbox takes and gives, and
# CoreFoundation's dictionaries, numbers and strings for its options.
# Only the headers used are on; objc2-core-foundation and the CoreMedia
# and CoreVideo crates are already in the tree through xcap and nokhwa.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool", "CVReturn"] }
objc2-video-toolbox = { version = "0.3.2", default-features = false, features = ["std", "VTBase", "VTCompressionProperties", "VTCompressionSession", "VTDecompressionProperties", "VTDecompressionSession", "VTErrors", "VTPixelTransferProperties", "VTPixelTransferSession", "VTSession", "objc2-core-media", "objc2-core-video"] }

[features]
# The ScreenCast portal and PipeWire on by default, so a plain `cargo
# build` shares the screen under Wayland as releases do. It needs
# PipeWire's headers and libclang to build on Linux; elsewhere its
# dependencies are not there and it does nothing.
default = ["pipewire"]
# The ScreenCast portal and PipeWire, for sharing the screen under
# Wayland and in the Flatpak. Without it (`--no-default-features`) the
# helper shares only X11 screens on Linux, and says it cannot capture
# under Wayland.
pipewire = ["dep:ashpd", "dep:pipewire", "dep:futures-lite"]

[dev-dependencies]
# The tests hash decoded pictures to compare them with ffmpeg's.
sha2 = "0.11"

[lints.rust]
# This crate is where the unsafe code lives that the app forbids: the
# calls into libva, the PipeWire stream, V4L2 (the camera on Linux),
# Media Foundation and Direct3D 11 (Windows) and one fcntl. Everything else in it is denied
# unsafe code, and the modules that need it say so
# (`#[allow(unsafe_code)]`).
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "warn"
