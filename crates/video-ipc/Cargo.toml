[package]
name = "noslacking-video-ipc"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "The messages between NoSlacking and its hardware video helper"
repository = "https://github.com/Yannicked/NoSlacking"

# Plain std: both sides of the pipe link it, and neither should pull in
# more than it needs to read a length and a few fields.
[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
