# The Flatpak of NoSlacking, built by the release workflow (and locally,
# see packaging/flatpak/README.md). Flatpak builds offline: the crates come
# from cargo-sources.json, generated from Cargo.lock at build time.
id: cloud.yannick.NoSlacking
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # libclang, for the PipeWire bindings the video helper makes at build
  # time (the SDK has PipeWire's headers but no libclang).
  - org.freedesktop.Sdk.Extension.llvm22
command: noslacking
finish-args:
  # The window, on Wayland or else X11, drawn with the GPU.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # No camera yet: the video helper opens cameras through V4L2, which
  # here would take --device=all, so the camera list stays empty until
  # the helper uses the Camera portal and PipeWire instead (TODO.md).
  # Sharing the screen needs nothing more: the ScreenCast portal hands
  # the helper its PipeWire stream.
  # Slack itself.
  - --share=network
  # Voice clips and sound files played in the app (through the runtime's
  # ALSA, which talks to PulseAudio or PipeWire's stand-in for it). The
  # same socket carries recording, so the microphone in huddles needs
  # nothing more.
  - --socket=pulseaudio
  # Desktop notifications, and the keyring that holds the tokens.
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  # The tray item: its watcher, and the StatusNotifierItem name it takes.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.*
  # "Save" puts files in Downloads.
  - --filesystem=xdg-download
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
    CARGO_HOME: /run/build/noslacking/cargo
    CARGO_NET_OFFLINE: 'true'
modules:
  - name: noslacking
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      # The app and its video helper. The runtime has libva and
      # its GL extension Mesa's VA-API drivers; --device=dri lets the
      # helper reach the GPU. The helper's `pipewire` feature, on by
      # default, shares the screen through the portal, as Wayland wants.
      - cargo --offline build --release --locked -p noslacking -p noslacking-video
      - install -Dm755 target/release/noslacking /app/bin/noslacking
      - install -Dm755 target/release/noslacking-video /app/bin/noslacking-video
      - install -Dm644 packaging/applications/cloud.yannick.NoSlacking.desktop
        /app/share/applications/cloud.yannick.NoSlacking.desktop
      - install -Dm644 packaging/metainfo/cloud.yannick.NoSlacking.metainfo.xml
        /app/share/metainfo/cloud.yannick.NoSlacking.metainfo.xml
      - install -Dm644 packaging/icons/hicolor/scalable/apps/cloud.yannick.NoSlacking.svg
        /app/share/icons/hicolor/scalable/apps/cloud.yannick.NoSlacking.svg
      - for size in 32 48 64 128 256 512; do
          install -Dm644 packaging/icons/hicolor/${size}x${size}/apps/cloud.yannick.NoSlacking.png
          /app/share/icons/hicolor/${size}x${size}/apps/cloud.yannick.NoSlacking.png;
        done
    sources:
      # The checkout, without what is built or local to one machine (a
      # .cargo/config.toml naming a linker the SDK lacks, say).
      - type: dir
        path: ../..
        skip:
          - target
          - .git
          - .claude
          - .cargo
          - packaging/flatpak/build
          - packaging/flatpak/repo
          - packaging/flatpak/.flatpak-builder
      - cargo-sources.json
