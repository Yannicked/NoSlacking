[package]
name = "noslacking"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
# Built from git dependencies, so never published to crates.io; cargo-deny
# also reads this to accept them.
publish = false
description = "A native Slack client"
keywords = ["slack", "chat", "egui", "client"]
categories = ["gui"]

[lib]
name = "noslacking"
path = "src/lib.rs"

[[bin]]
name = "noslacking"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
directories = "6"
# One protected-store API, with only each target's native provider below.
# Slack tokens and the app's client secret never touch the settings file.
keyring-core = "1"
# The whole UI. glow keeps the binary and the dependency tree small; a chat
# client draws nothing wgpu would help with.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "links", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "svg", "gif", "webp"] }
# Slack serves avatars as JPEG and PNG, custom emoji as PNG and GIF, and
# attachments in whatever was uploaded.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# The shared foundation of ZapFast and Spotifast (crmne/fastframe). Every
# crate comes from the same tag; move them together.
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-emoji = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-macos = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
# The Web API and file transfers. rustls everywhere so the client links one
# TLS stack and builds without OpenSSL on every platform.
# socks and system-proxy: Settings → Network (the system's proxy settings
# on macOS and Windows as well as the environment, or a SOCKS5 proxy).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2", "multipart", "cookies", "stream", "socks", "system-proxy"] }
# Already under reqwest: its proxy matcher, so the WebSockets pick the same
# proxy as every HTTP request.
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy", "client-proxy-system"] }
# Socket Mode: Slack's real-time events over a WebSocket.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net", "io-util"] }
# Slack names emoji by shortcode (`:thumbsup:`); this is the table that turns
# those into Unicode, and the picker's list.
emojis = "0.9"
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.22"
rand = "0.10"
urlencoding = "2"
open = "5"
jiff = "0.2"
# The native file picker for uploads.
rfd = "0.17.2"
# Images pasted into the composer. egui's clipboard only carries text;
# egui-winit already links arboard with these features, so this adds no
# crate to the build.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# The offline cache's encryption (src/offline.rs). chacha20 is already in
# the tree through rand; the nonces come from rand too.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
# Spell checking in the composer with the system's Hunspell dictionaries:
# pure Rust (Helix's), MPL-2.0, two small dependencies.
spellbook = "0.4.2"

# Desktop notifications: D-Bus on Linux and the BSDs, the notification
# center on macOS, toasts on Windows. Elsewhere there are none.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly", target_os = "macos", windows))'.dependencies]
notify-rust = "4.18"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The unread count on the launcher icon (the LauncherEntry signal). Already
# in the tree for the keyring and accessibility; same version.
zbus = { version = "5.19", default-features = false, features = ["blocking-api"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[build-dependencies]
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2", features = ["build"] }
# The .exe's icon and version info (build.rs; it does nothing for other
# targets). Without the toml feature it pulls in no parser.
winresource = { version = "0.1", default-features = false }

[features]
default = ["highlight", "bundled-emoji"]
# Compiles all of Noto Color Emoji (about 10 MB) into Linux and other Unix
# builds, for desktops whose emoji font is one fastframe-emoji cannot draw
# (COLRv1 only, as on Fedora). Without it the app reads
# share/noslacking/NotoColorEmoji.ttf at start-up if a package installed
# one. macOS and Windows never carry the full font.
bundled-emoji = []
# Sample data and the screenshot flag; never part of a release build.
demo = []
# Colours code blocks that name their language (```` ```rust ````). Our own
# small lexer, a few kilobytes; turn it off for plain code blocks.
highlight = []

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Line numbers in backtraces, but no full debug info: with it the debug
# binary was 800 MB and linking it was most of every rebuild. For a
# debugger session, build with CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

# Image decoding and immediate-mode layout are too slow at opt-level 0 to
# try the app in development. Keep every dependency optimized while the
# application crate itself stays incremental. Their debug info is left
# out: nobody steps through egui's internals here.
[profile.dev.package."*"]
opt-level = 2
debug = false

[patch.crates-io]
# crmne/egui apps-0.36, shared with ZapFast and Spotifast: egui 0.36.1 with
# bidi shaping, egui's busy-loop fix and Wayland frame pacing. Every egui
# crate comes from the same revision so they share one emath and epaint.
# Move together with the other fastframe apps.
ecolor = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
eframe = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
emath = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
epaint = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
# crmne/winit apps-0.30, shared with the same apps (Wayland occlusion and
# clipboard fixes). eframe from the fork above calls its API.
winit = { git = "https://github.com/crmne/winit", rev = "544a73716c7a54c916d97d6c86c0b1bdaa81234e" }
