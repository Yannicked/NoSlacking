[package]
name = "noslacking"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
# Built from git dependencies, so never published to crates.io; cargo-deny
# also reads this to accept them.
publish = false
description = "A native Slack client"
repository = "https://github.com/Yannicked/NoSlacking"
keywords = ["slack", "chat", "egui", "client"]
categories = ["gui"]

[workspace]
# The app, and its video helper with the messages they share (crates/;
# see crates/noslacking-video). Video is decoded only in the helper, so
# `cargo build` at the root builds both, and the helper lands beside the
# app where it looks first; `cargo run` builds the app alone, so build
# once before running the demo's video. Profiles and patches below apply
# to every member.
members = [".", "crates/video-ipc", "crates/noslacking-video"]
default-members = [".", "crates/noslacking-video"]

[lib]
name = "noslacking"
path = "src/lib.rs"

[[bin]]
name = "noslacking"
path = "src/main.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
directories = "6"
# One protected-store API, with only each target's native provider below.
# Slack tokens and the app's client secret never touch the settings file.
keyring-core = "1"
# The whole UI. glow keeps the binary and the dependency tree small; a chat
# client draws nothing wgpu would help with.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["image", "svg", "gif", "webp"] }
# Slack serves avatars as JPEG and PNG, custom emoji as PNG and GIF, and
# attachments in whatever was uploaded. Link previews show the site's
# favicon, which is often an ICO.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "ico"] }
# The shared foundation of ZapFast and Spotifast (crmne/fastframe). Every
# crate comes from the same tag; move them together.
fastframe-text = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-emoji = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-log = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-shell = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-macos = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
fastframe-tray = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2" }
# The Web API and file transfers. rustls everywhere so the client links one
# TLS stack and builds without OpenSSL on every platform.
# socks and system-proxy: Settings → Network (the system's proxy settings
# on macOS and Windows as well as the environment, or a SOCKS5 proxy).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "gzip", "http2", "multipart", "stream", "socks", "system-proxy"] }
# Already under reqwest: its proxy matcher, so the WebSockets pick the same
# proxy as every HTTP request.
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy", "client-proxy-system"] }
# Socket Mode: Slack's real-time events over a WebSocket.
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# signal: `--huddle-probe` leaves the call cleanly on Ctrl+C.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "net", "io-util", "signal"] }
# Slack names emoji by shortcode (`:thumbsup:`); this is the table that turns
# those into Unicode, and the picker's list.
emojis = "0.9"
sha1 = "0.11"
sha2 = "0.11"
base64 = "0.22"
rand = "0.10"
percent-encoding = "2"
open = "5"
jiff = "0.2"
# The native file picker for uploads.
rfd = "0.17.2"
# Images pasted into the composer. egui's clipboard only carries text;
# egui-winit already links arboard with these features, so this adds no
# crate to the build.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# The offline cache's encryption (src/offline.rs). chacha20 is already in
# the tree through rand; the nonces come from rand too.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
# Spell checking in the composer with the system's Hunspell dictionaries:
# pure Rust (Helix's), MPL-2.0, two small dependencies.
spellbook = "0.4.2"
# Voice clips, sound files and huddles play in the app. rodio drives the
# sound device through cpal (ALSA on Linux, so the packages need
# libasound2) and decodes with symphonia (MPL-2.0, pure Rust): AAC in
# MP4/M4A, MP3, Ogg Vorbis, FLAC and WAV. Symphonia has no
# Opus decoder; those open in the system's player.
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp4", "mp3", "vorbis", "flac", "wav"] }

# Listening and talking in huddles (src/huddle_audio.rs; see TODO.md).
# Chime's signaling frames are protobuf; the Rust for them is generated
# ahead of time and checked in (src/huddle_audio/chime/), so the build
# needs no protoc, only prost's derive.
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
# WebRTC, sans-IO, with OpenSSL's DTLS on every platform. Chime's media
# servers refuse the handshake of str0m's own DTLS, dimpl (alert 40,
# handshake_failure), which every other str0m backend (aws-lc-rs,
# rust-crypto, apple-crypto, wincrypto) uses; OpenSSL's was taken. Linux
# links the system's OpenSSL (libssl-dev to build); macOS and Windows
# build it from source, below.
str0m = { version = "0.24.1", default-features = false, features = ["openssl"] }
# The certificate Chime's media server shows, read for the log only
# (str0m-openssl's own OpenSSL, so no crate is added).
openssl = "0.10.78"
# Opus in pure Rust, without unsafe code or a C library to find.
opus-decoder = "0.1.1"
# The TURN client's long-term credential: HMAC-SHA1 (sha1 is above) keyed
# with MD5.
hmac = "0.13"
md-5 = { version = "0.11", default-features = false }
# TURN over TLS: the same rustls (with ring) and system roots reqwest uses.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
# str0m and its DTLS log through tracing; with this they reach the app's
# log too, so a probe run can show ICE and DTLS (NOSLACKING_LOG=str0m=debug).
tracing = { version = "0.1.44", default-features = false, features = ["log", "std"] }

# Talking in a huddle: the microphone through cpal (rodio's), WebRTC's
# audio processing and an Opus encoder, all pure Rust.
# opus-rs: libopus 1.6 ported (BSD-3-Clause, no dependencies); its unsafe
# is SIMD and unchecked indexing. sonora: WebRTC's AEC3, noise
# suppression, AGC2 and high-pass filter, M145, ported (BSD-3-Clause);
# its unsafe is SIMD behind runtime CPU detection. sonora-agc2's RNN
# voice detector decides what DTX leaves out; sonora-common-audio's sinc
# resampler brings a 44.1 kHz microphone to 48. Both come with sonora.
opus-rs = "0.1.34"
sonora = "0.2.0"
sonora-agc2 = "0.2.0"
sonora-common-audio = "0.2.0"
sonora-simd = "0.2.0"

# Watching screen shares and cameras in a huddle (the `huddle-video`
# feature): H.264 is decoded in the noslacking-video helper process
# (crates/noslacking-video, which ships beside the app), on the GPU or in
# software, never in the app: a decoder reads strangers' streams, and a
# panic aborts a release build. The picture comes back as I420 and goes
# to RGBA with `yuv` (BSD-3-Clause/Apache-2.0, SIMD chosen at run time;
# its unsafe is the intrinsics), since eframe's glow cannot take a YUV
# shader without unsafe in our crate. See docs/research/huddle-video.md.
yuv = { version = "0.8.19", optional = true }
# The messages the app and the helper exchange (decoding, and encoding
# our camera on the GPU). Plain std; the helper itself is not a
# dependency.
noslacking-video-ipc = { path = "crates/video-ipc", optional = true }
# Writes the RGBA straight into egui's pixels (already in the tree
# through egui; no crate added).
bytemuck = { version = "1.25", optional = true }

# Sending your camera in a huddle (the `huddle-camera` feature): H.264
# constrained baseline encoded in pure Rust by rusty_h264's encoder (the
# decoder's project, BSD-2-Clause, forbid(unsafe); its SIMD is the same
# rusty_h264-accel, no assembly or C), chosen after a spike
# (docs/research/huddle-video.md, Stage 3). Default features off, as for
# the decoder: they install a global allocator. rusty_h264-common holds
# the frame type the encoder takes.
rusty_h264-encoder = { version = "0.16", default-features = false, features = ["std", "asm"], optional = true }
rusty_h264-common = { version = "0.16", default-features = false, features = ["std", "asm"], optional = true }
# The camera itself (Apache-2.0): V4L2 on Linux, AVFoundation on macOS,
# Media Foundation on Windows. Without its default `decoding` feature,
# which would build mozjpeg's C; MJPEG is decoded by `image` instead.
# On Linux its V4L2 bindings are generated by bindgen at build time, so
# the build needs libclang (clang's library; no C is compiled); on macOS
# objc_exception compiles a one-file Objective-C shim with Xcode's clang.
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"], optional = true }

# The file viewer (src/viewer.rs): spreadsheets (MIT, pure Rust; only its
# XML readers are used), CSV and TSV (Unlicense/MIT), and zip listings.
# zip and quick-xml are calamine's own, at its versions and features, named
# here because the viewer measures a workbook's parts before calamine reads
# them; they add no crate.
calamine = { version = "0.36", default-features = false }
csv = { version = "1.4", default-features = false }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.41", default-features = false }

# Microsoft Teams sends some live events gzip-compressed (`teams`); already
# in the build as zip's.
flate2 = { version = "1.1", optional = true }

# Desktop notifications: D-Bus on Linux and the BSDs, the notification
# center on macOS, toasts on Windows. Elsewhere there are none.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly", target_os = "macos", windows))'.dependencies]
notify-rust = "4.18"

# For huddles: OpenSSL built from source with the app (openssl-src;
# Perl and a C compiler, which the CI runners have), as macOS and Windows
# have no OpenSSL to link. The same str0m as above, one feature more.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
str0m = { version = "0.24.1", default-features = false, features = ["openssl", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The unread count on the launcher icon (the LauncherEntry signal). Already
# in the tree for the keyring and accessibility; same version.
zbus = { version = "5.19", default-features = false, features = ["blocking-api"] }
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
# The camera's tests decode what the encoder made, whatever the features.
rusty_h264-decoder = { version = "0.16", default-features = false, features = ["std", "asm"] }
# Tests decode through the helper's own code on a thread (its server with
# no GPU back end), never the program itself, which would open the GPU.
noslacking-video = { path = "crates/noslacking-video" }

[build-dependencies]
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.2.2", features = ["build"] }
# The .exe's icon and version info (build.rs; it does nothing for other
# targets). Without the toml feature it pulls in no parser.
winresource = { version = "0.1", default-features = false }

# Linux packages for the release workflow (cargo-deb, cargo-generate-rpm):
# the same files as the release's .tar.gz, in the system's own places.
# What the binary links is read from it; the windowing and GL libraries it
# loads itself at start-up are named here, as no scan can see them.
[package.metadata.deb]
maintainer = "Yannick de Jong <yannickludodejong@gmail.com>"
section = "net"
priority = "optional"
extended-description = "One window for your Slack workspaces: channels, direct messages, threads, reactions, files and notifications, without Electron."
# ALSA is linked, so $auto finds it (as libasound2t64 on newer releases);
# the others are loaded at run time and must be named.
depends = "$auto, libxkbcommon0, libegl1, libgl1"
# libva and a VA-API driver: noslacking-video loads them at run time to
# decode huddle video on the GPU; without them it decodes in software.
# The ScreenCast portal and PipeWire: how the helper sees the screen
# under Wayland in a build with `huddle-share` (the helper built with its
# `pipewire` feature then links libpipewire; $auto reads only the app).
recommends = "libwayland-client0, libxkbcommon-x11-0, libva2, libva-drm2, mesa-va-drivers | intel-media-va-driver, xdg-desktop-portal, pipewire"
assets = [
    ["target/release/noslacking", "usr/bin/", "755"],
    # The video helper, beside the app where it looks first.
    ["target/release/noslacking-video", "usr/bin/", "755"],
    ["packaging/applications/cloud.yannick.NoSlacking.desktop", "usr/share/applications/", "644"],
    ["packaging/metainfo/cloud.yannick.NoSlacking.metainfo.xml", "usr/share/metainfo/", "644"],
    ["packaging/icons/hicolor/scalable/apps/cloud.yannick.NoSlacking.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/icons/hicolor/32x32/apps/cloud.yannick.NoSlacking.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["packaging/icons/hicolor/48x48/apps/cloud.yannick.NoSlacking.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["packaging/icons/hicolor/64x64/apps/cloud.yannick.NoSlacking.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["packaging/icons/hicolor/128x128/apps/cloud.yannick.NoSlacking.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["packaging/icons/hicolor/256x256/apps/cloud.yannick.NoSlacking.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["packaging/icons/hicolor/512x512/apps/cloud.yannick.NoSlacking.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["LICENSE", "usr/share/doc/noslacking/", "644"],
    ["README.md", "usr/share/doc/noslacking/", "644"],
]

[package.metadata.generate-rpm]
auto-req = "auto"
# By library, so the same package fits Fedora and openSUSE.
requires = { "libxkbcommon.so.0()(64bit)" = "*", "libEGL.so.1()(64bit)" = "*", "libGL.so.1()(64bit)" = "*" }
recommends = { "libwayland-client.so.0()(64bit)" = "*", "libxkbcommon-x11.so.0()(64bit)" = "*" }
# libva for the video helper (loaded at run time, so auto-req
# cannot see it); the driver comes with Mesa or intel-media-driver.
suggests = { "libva.so.2()(64bit)" = "*", "libva-drm.so.2()(64bit)" = "*" }
assets = [
    { source = "target/release/noslacking", dest = "/usr/bin/noslacking", mode = "755" },
    { source = "target/release/noslacking-video", dest = "/usr/bin/noslacking-video", mode = "755" },
    { source = "packaging/applications/cloud.yannick.NoSlacking.desktop", dest = "/usr/share/applications/cloud.yannick.NoSlacking.desktop", mode = "644" },
    { source = "packaging/metainfo/cloud.yannick.NoSlacking.metainfo.xml", dest = "/usr/share/metainfo/cloud.yannick.NoSlacking.metainfo.xml", mode = "644" },
    { source = "packaging/icons/hicolor/scalable/apps/cloud.yannick.NoSlacking.svg", dest = "/usr/share/icons/hicolor/scalable/apps/cloud.yannick.NoSlacking.svg", mode = "644" },
    { source = "packaging/icons/hicolor/32x32/apps/cloud.yannick.NoSlacking.png", dest = "/usr/share/icons/hicolor/32x32/apps/cloud.yannick.NoSlacking.png", mode = "644" },
    { source = "packaging/icons/hicolor/48x48/apps/cloud.yannick.NoSlacking.png", dest = "/usr/share/icons/hicolor/48x48/apps/cloud.yannick.NoSlacking.png", mode = "644" },
    { source = "packaging/icons/hicolor/64x64/apps/cloud.yannick.NoSlacking.png", dest = "/usr/share/icons/hicolor/64x64/apps/cloud.yannick.NoSlacking.png", mode = "644" },
    { source = "packaging/icons/hicolor/128x128/apps/cloud.yannick.NoSlacking.png", dest = "/usr/share/icons/hicolor/128x128/apps/cloud.yannick.NoSlacking.png", mode = "644" },
    { source = "packaging/icons/hicolor/256x256/apps/cloud.yannick.NoSlacking.png", dest = "/usr/share/icons/hicolor/256x256/apps/cloud.yannick.NoSlacking.png", mode = "644" },
    { source = "packaging/icons/hicolor/512x512/apps/cloud.yannick.NoSlacking.png", dest = "/usr/share/icons/hicolor/512x512/apps/cloud.yannick.NoSlacking.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/noslacking/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/noslacking/README.md", mode = "644", doc = true },
]

[features]
default = ["highlight", "bundled-emoji"]
# Compiles all of Noto Color Emoji (about 10 MB) into Linux and other Unix
# builds, for desktops whose emoji font is one fastframe-emoji cannot draw
# (COLRv1 only, as on Fedora). Without it the app reads
# share/noslacking/NotoColorEmoji.ttf at start-up if a package installed
# one. macOS and Windows never carry the full font.
bundled-emoji = []
# Sample data and the screenshot flag; never part of a release build.
demo = []
# Watching screen shares and cameras in huddles: a call window with the
# share and the camera tiles, decoded by the noslacking-video helper
# (which must ship beside the app). Off until it has been tried against
# Slack.
huddle-video = ["dep:yuv", "dep:bytemuck", "dep:noslacking-video-ipc"]
# Sending your camera in huddles: the camera, opened only while it is
# on, encoded to H.264 on a thread of its own, with a self-preview in the
# call bar; on the GPU through the helper when it can. Independent of
# `huddle-video` (sending needs no decoder). Off until it has been tried
# against Slack.
huddle-camera = ["dep:rusty_h264-encoder", "dep:rusty_h264-common", "dep:nokhwa", "dep:yuv", "dep:bytemuck", "dep:noslacking-video-ipc"]
# Sharing your screen in huddles: a second Chime attendee (`#content`)
# that sends only the screen, captured only while sharing and encoded
# by the noslacking-video helper (the ScreenCast portal and PipeWire on
# Wayland and in the Flatpak when the helper is built with its
# `pipewire` feature, the X server on X11, xcap on macOS and Windows; on
# the GPU when it can): the app adds no capture dependency and only
# sends the H.264 the helper hands it. Off until it has been tried
# against Slack.
huddle-share = ["huddle-camera"]
# Microsoft Teams workspaces (src/teams/, src/backend/teams.rs): off
# until it has been tried more widely. Signs in as Microsoft's own Teams
# client, which an organisation's app policies do not see; see
# docs/research/microsoft-teams.md before turning it on.
teams = ["dep:flate2"]
# Colours code blocks that name their language (```` ```rust ````). Our own
# small lexer, a few kilobytes; turn it off for plain code blocks.
highlight = []

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Line numbers in backtraces, but no full debug info: with it the debug
# binary was 800 MB and linking it was most of every rebuild. For a
# debugger session, build with CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

# Image decoding and immediate-mode layout are too slow at opt-level 0 to
# try the app in development. Keep every dependency optimized while the
# application crate itself stays incremental. Their debug info is left
# out: nobody steps through egui's internals here.
[profile.dev.package."*"]
opt-level = 2
debug = false

[patch.crates-io]
# opus-decoder 0.1.1 with two fixes (vendor/opus-decoder/VENDORED.md): a
# hybrid packet naming more redundancy bytes than it holds panicked (in
# release too, which aborts the app), and frames with 16 short blocks
# overflowed a shift in debug builds. Drop once upstream has both.
opus-decoder = { path = "vendor/opus-decoder" }
# crmne/egui apps-0.36, shared with ZapFast and Spotifast: egui 0.36.1 with
# bidi shaping, egui's busy-loop fix and Wayland frame pacing. Every egui
# crate comes from the same revision so they share one emath and epaint.
# Move together with the other fastframe apps.
ecolor = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
eframe = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui-wgpu = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui-winit = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui_extras = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
egui_glow = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
emath = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
epaint = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
epaint_default_fonts = { git = "https://github.com/crmne/egui", rev = "0b431145c22ee27b20b0aff7243d74f4b32e9a79" }
# crmne/winit apps-0.30, shared with the same apps (Wayland occlusion and
# clipboard fixes). eframe from the fork above calls its API.
winit = { git = "https://github.com/crmne/winit", rev = "544a73716c7a54c916d97d6c86c0b1bdaa81234e" }
